name: Update experience

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Recalculate experience since Dec 2024
        run: python scripts/update_experience.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md assets/experience-dark.svg assets/experience-light.svg; then
            echo "Experience unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/experience-dark.svg assets/experience-light.svg
          git commit -m "Update experience duration"
          git push
