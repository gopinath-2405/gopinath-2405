<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Education: B.Sc. Mathematics, Government Arts College (Autonomous), Coimbatore, Sep 2021 – May 2024, CGPA 9.609 / 10, Distinction"><style>svg{--card:#ffffff;--card2:#f1f5f9;--border:#e2e8f0;--text:#0f172a;--muted:#475569;--faint:#64748b;--pill:#ffffff}.mono{font-family:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,'Helvetica Neue',Arial,sans-serif}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}.fade{animation:fade 1s ease both}.pulse{animation:pulse 2.4s ease-in-out infinite}</style><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0.000" stop-color="#d97706"/><stop offset="0.333" stop-color="#6366f1"/><stop offset="0.667" stop-color="#14b8a6"/><stop offset="1.000" stop-color="#d97706"/><animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="10s" repeatCount="indefinite"/></linearGradient><linearGradient id="tt" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0.000" stop-color="#d97706"/><stop offset="0.333" stop-color="#fbbf24"/><stop offset="0.667" stop-color="#818cf8"/><stop offset="1.000" stop-color="#d97706"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#d97706"/></linearGradient>
<linearGradient id="bgc" x1="0" y1="0" x2=".45" y2="1"><stop offset="0" style="stop-color:var(--card)"/><stop offset="1" style="stop-color:var(--card2)"/></linearGradient>
<radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#d97706" stop-opacity=".28"/><stop offset=".6" stop-color="#d97706" stop-opacity="0"/></radialGradient>
