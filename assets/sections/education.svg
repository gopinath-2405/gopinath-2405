<svg xmlns="http://www.w3.org/2000/svg" width="900" height="78" viewBox="0 0 900 78" role="img" aria-label="Education"><style>svg{--card:#111827;--card2:#172033;--border:#1e293b;--text:#f8fafc;--muted:#cbd5e1;--faint:#94a3b8;--pill:#0f1729}.mono{font-family:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,'Helvetica Neue',Arial,sans-serif}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}.fade{animation:fade 1s ease both}.pulse{animation:pulse 2.4s ease-in-out infinite}</style><defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0.000" stop-color="#d97706"/><stop offset="0.333" stop-color="#ea580c"/><stop offset="0.667" stop-color="#6366f1"/><stop offset="1.000" stop-color="#d97706"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="6s" repeatCount="indefinite"/></linearGradient><linearGradient id="l" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0.000" stop-color="#d97706"/><stop offset="0.333" stop-color="#ea580c"/><stop offset="0.667" stop-color="#6366f1"/><stop offset="1.000" stop-color="#d97706"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="4s" repeatCount="indefinite"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="fadeout" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".75" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="m"><rect width="900" height="78" fill="url(#fadeout)"/></mask></defs>
