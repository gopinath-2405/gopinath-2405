<svg xmlns="http://www.w3.org/2000/svg" width="900" height="206" viewBox="0 0 900 206" role="img" aria-label="What I bring: Auth &amp; Security, Performance &amp; Testing, AI-assisted Workflow"><style>svg{--card:#ffffff;--card2:#f1f5f9;--border:#e2e8f0;--text:#0f172a;--muted:#475569;--faint:#64748b;--pill:#ffffff}.mono{font-family:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,'Helvetica Neue',Arial,sans-serif}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}.fade{animation:fade 1s ease both}.pulse{animation:pulse 2.4s ease-in-out infinite}</style><g transform="translate(0 0)"><defs><linearGradient id="p0b" x1="0" y1="0" x2="1" y2="1"><stop offset="0.000" stop-color="#e11d48"/><stop offset="0.333" stop-color="#f472b6"/><stop offset="0.667" stop-color="transparent"/><stop offset="1.000" stop-color="#e11d48"/><animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="9s" repeatCount="indefinite"/></linearGradient>
