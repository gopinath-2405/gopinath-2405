<svg xmlns="http://www.w3.org/2000/svg" width="148" height="46" viewBox="0 0 148 46" role="img" aria-label="Portfolio"><style>svg{--card:#111827;--card2:#172033;--border:#1e293b;--text:#f8fafc;--muted:#cbd5e1;--faint:#94a3b8;--pill:#0f1729}.mono{font-family:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,'Helvetica Neue',Arial,sans-serif}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}.fade{animation:fade 1s ease both}.pulse{animation:pulse 2.4s ease-in-out infinite}</style><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0.000" stop-color="#14b8a6"/><stop offset="0.500" stop-color="#6366f1"/><stop offset="1.000" stop-color="#14b8a6"/><animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="5s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#14b8a6" stop-opacity=".16"/><stop offset="1" stop-color="#6366f1" stop-opacity=".10"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="p"><rect width="148" height="46" rx="23.0"/></clipPath></defs>
<g clip-path="url(#p)"><rect width="148" height="46" style="fill:var(--pill)"/><rect width="148" height="46" fill="url(#bg)"/>
<rect x="-80" y="-10" width="50" height="66" fill="url(#shine)" transform="skewX(-20)"><animate attributeName="x" values="-80;208;208" keyTimes="0;.35;1" dur="4s" begin="0.0s" repeatCount="indefinite"/></rect></g>
<rect x="1" y="1" width="145.6" height="44" rx="22.0" fill="none" stroke="url(#b)" stroke-width="2"/>
